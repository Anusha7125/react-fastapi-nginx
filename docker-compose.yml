
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: q7-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: apidashboard
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:-devpassword123}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: apidashboard
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d apidashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: q7-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
